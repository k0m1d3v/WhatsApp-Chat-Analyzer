[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wca"
version = "2.0.0"
description = "WhatsApp Chat Analyzer: stats, awards and charts for a WhatsApp chat, with optional AI insights"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["rich>=13", "emoji>=2.10"]

[project.optional-dependencies]
claude = ["anthropic>=2.14"]
openai = ["openai>=1.51"]
ai = ["anthropic>=2.14", "openai>=1.51"]
dev = ["pytest>=8"]

[project.scripts]
wca = "wca.cli:main"

[tool.setuptools]
packages = ["wca"]
